name: CI

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  verify:
    name: Verify application, client, and packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify the Spring Boot application against local PostgreSQL
        working-directory: app
        run: mvn -B -ntp verify

      - name: Verify the React client
        run: docker build --target test --file client/Dockerfile .

      - name: Build the API runtime image
        run: docker build --file app/Dockerfile --tag financial-app-api:ci app
