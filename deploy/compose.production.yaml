name: financial-app

services:
  app:
    image: financial-app-api:${IMAGE_TAG:-local}
    build:
      context: ../app
    restart: unless-stopped
    environment:
      FINANCIAL_APP_DATABASE_DIALECT: postgresql
      FINANCIAL_APP_DATABASE_JDBC_URL: ${DATABASE_JDBC_URL:?Set DATABASE_JDBC_URL in deploy/.env}
      FINANCIAL_APP_DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in deploy/.env}
      FINANCIAL_APP_DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in deploy/.env}
      FINANCIAL_APP_DATABASE_MAXIMUM_POOL_SIZE: ${DATABASE_MAXIMUM_POOL_SIZE:-10}
      FINANCIAL_APP_CORS_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env}
      FINANCIAL_APP_SESSION_COOKIE_SECURE: "true"
      FINANCIAL_APP_CSRF_COOKIE_SECURE: "true"
    volumes:
      - type: bind
        source: ${DATABASE_CA_CERTIFICATE_FILE:?Set DATABASE_CA_CERTIFICATE_FILE in deploy/.env}
        target: /run/certificates/aws-rds-ca.pem
        read_only: true
    expose:
      - "8080"
    networks:
      - internal

  frontend:
    image: financial-app-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    networks:
      - internal

networks:
  internal:
    driver: bridge
